# Copy to /etc/supervisor/conf.d/a2a-pusht.conf on the training server when starting a full run.
# Then: supervisorctl reread && supervisorctl update
# To stop: supervisorctl stop a2a-pusht
[program:a2a-pusht]
command=/bin/bash /workspace/A2A_pushT/scripts/train-server.sh
directory=/workspace/A2A_pushT
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1",SDL_VIDEODRIVER="dummy",SDL_AUDIODRIVER="dummy"
stdout_logfile=/workspace/A2A_pushT/outputs/train.log
stdout_logfile_maxbytes=50000000
stdout_logfile_backups=2
redirect_stderr=true
